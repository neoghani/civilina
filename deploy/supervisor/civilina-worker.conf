; CIVILINA Engineering — queue worker (pilot server).
; /etc/supervisor/conf.d/civilina-worker.conf, then:
;   supervisorctl reread && supervisorctl update

[program:civilina-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /srv/civilina/app/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=512
directory=/srv/civilina/app
user=civilina
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/srv/civilina/app/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
