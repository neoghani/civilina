# CIVILINA Engineering — nginx site (pilot server).
# /etc/nginx/sites-available/app.civilina.com, then:
#   ln -s ../sites-available/app.civilina.com /etc/nginx/sites-enabled/
#   certbot --nginx -d app.civilina.com     (adds the HTTPS server block)

server {
    listen 80;
    listen [::]:80;
    server_name app.civilina.com;

    root /srv/civilina/app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25m;   # evidence uploads (PV, photos)

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # No indexing of the application by search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 30d;
        access_log off;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Any other PHP file, dotfiles (.env, .git) and storage are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
